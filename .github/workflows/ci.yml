# Beep CI: runs every test on each push (tests/ci/run.mjs) and publishes a
# report on the run page + the "ci-report" artifact.
#
# Step 2 (now): report only. Vercel still deploys every push to main by itself.
# Step 3 (next): Vercel's auto-deploy goes off and this workflow deploys to
# production only when everything passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run of an older one that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}

      - name: Install Playwright (browser tests)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Run everything
        run: npm run test:ci

      - name: Upload report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: tests/ci/out/
          retention-days: 14
          if-no-files-found: ignore