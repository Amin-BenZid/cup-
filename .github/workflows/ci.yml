# Beep CI/CD: runs every test on each push (tests/ci/run.mjs), publishes a
# report on the run page + the "ci-report" artifact, and deploys to
# production ONLY when everything passes. Vercel's own auto-deploy for main
# is off (vercel.json), so a failing push never reaches prod.
#
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Re-deploy by hand: Actions → CI → Run workflow (on main).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run of an older one that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}

      - name: Install Playwright (browser tests)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Run everything
        run: npm run test:ci

      - name: Upload report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: tests/ci/out/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to production
    needs: test
    # Only real pushes to main (or a manual run on main), never pull requests.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One production deploy at a time; a deploy that started is never cut off.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the deploy secrets are set
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings and env from Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## 🚀 Deployed to production"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Deployment: $url"
          } >> "$GITHUB_STEP_SUMMARY"